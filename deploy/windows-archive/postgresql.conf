# 데이터 디렉터리는 Windows NTFS에 두며 WSL 원본과 완전히 분리한다.
include = 'D:/PostgreSQL/data/postgresql.conf'
data_directory = 'D:/PostgreSQL/data'
hba_file = 'D:/PostgreSQL/pg_hba.conf'
ident_file = 'D:/PostgreSQL/pg_ident.conf'
listen_addresses = '127.0.0.1'
port = 55432
shared_buffers = '256MB'
work_mem = '16MB'
maintenance_work_mem = '512MB'
# USB HDD에서 병렬 스캔끼리 헤드 이동을 경쟁하지 않게 한다.
max_parallel_maintenance_workers = 0
max_parallel_workers_per_gather = 0
max_connections = 20
max_wal_size = '4GB'
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'
log_rotation_age = '1d'
log_truncate_on_rotation = on
log_statement = 'none'
timezone = 'UTC'
